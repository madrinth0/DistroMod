[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distromod"
version = "0.2.0"
description = "A modular Linux desktop customization tool that adapts to your desktop environment automatically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "DistroMod Contributors" }]
keywords = ["linux", "desktop", "customization", "themes", "icons", "kde", "gnome", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
distromod = "distromod.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/madrinth0/DistroMod"
Issues = "https://github.com/madrinth0/DistroMod/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["distromod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
